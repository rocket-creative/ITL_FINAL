name: Gene expansion weekly promotion

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify Supabase secrets
        run: |
          missing=0
          for name in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub secret::$name is not configured in repository secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the three Supabase secrets under Settings → Secrets and variables → Actions."
            exit 1
          fi
      - run: npm ci
      - name: Seed genes and model types
        run: npm run gene-expansion:seed
      - name: Ingest biology signals
        run: npm run gene-expansion:ingest
      - name: Generate gene type pages
        run: npm run gene-expansion:generate
      - name: Validate acceptance criteria
        run: npm run gene-expansion:validate
      - name: Lint build inquiry copy
        run: npm run gene-expansion:lint-copy
